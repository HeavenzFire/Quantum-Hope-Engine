name: Quantum Equation Solver tests
on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  powershell-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run numerical verification
        shell: powershell
        run: .\EquationSolver.ps1 -Test
